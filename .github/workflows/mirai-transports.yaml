name: mirai transports

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    name: transports (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install macOS system libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install gettext
          echo "PKG_CPPFLAGS=-I$(brew --prefix gettext)/include" >> $GITHUB_ENV
          echo "PKG_LIBS=-L$(brew --prefix gettext)/lib -lintl" >> $GITHUB_ENV

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::callr
            any::pkgload
          needs: check
      - name: Compare default and TCP worker pools
        run: Rscript tools/check-mirai-transports.R transport-results
      - name: Preserve transport results and process logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirai-transports-${{ matrix.os }}
          path: transport-results/
          if-no-files-found: warn
