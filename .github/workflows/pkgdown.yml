# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches:
      - main
      - master
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      # The hosted image selects Azure first through an APT mirror list. Remove
      # that slow entry while retaining the official archive/security priorities.
      - name: Use the Ubuntu archive for Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ubuntu_mirrors=/etc/apt/apt-mirrors.txt
          if [ ! -f "$ubuntu_mirrors" ]; then
            echo "::error::Expected Ubuntu APT mirror list at $ubuntu_mirrors."
            exit 1
          fi
          sudo perl -ni -e 'print unless m{^https?://azure[.]archive[.]ubuntu[.]com/ubuntu/(?:[[:space:]]|$)}' "$ubuntu_mirrors"
          if ! grep -q '^https://archive[.]ubuntu[.]com/ubuntu/[[:space:]]' "$ubuntu_mirrors" || grep -q '://azure[.]archive[.]ubuntu[.]com/' "$ubuntu_mirrors"; then
            echo "::error::Ubuntu archive mirror list was not configured in $ubuntu_mirrors."
            exit 1
          fi

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Check precompiled vignettes
        run: Rscript tools/raw-vignettes.R check

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
          needs: website

      - name: Deploy package
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'

      - name: Build site without deploying
        if: github.event_name == 'pull_request'
        run: |
          Rscript -e 'pkgdown::build_site(preview = FALSE, install = FALSE)'
