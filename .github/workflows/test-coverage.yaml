on:
  push:
    branches:
      - master
  pull_request:

name: test-coverage

jobs:
  test-coverage:
    runs-on: macOS-latest
    timeout-minutes: 90

    permissions:
      contents: read
      id-token: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install macOS system libraries
        shell: bash
        run: |
          brew install gettext
          echo "PKG_CPPFLAGS=-I$(brew --prefix gettext)/include" >> $GITHUB_ENV
          echo "PKG_LIBS=-L$(brew --prefix gettext)/lib -lintl" >> $GITHUB_ENV

      - name: Set EPWSHIFTR_CHECK_CACHE
        shell: bash
        run: |
          echo "EPWSHIFTR_CHECK_CACHE=${{ runner.temp }}/epwshiftr" >> $GITHUB_ENV
          if [ ! -d "${{ runner.temp }}/epwshiftr" ]; then mkdir -p "${{ runner.temp }}/epwshiftr"; fi

      - name: Cache NetCDF files
        uses: actions/cache@v4
        with:
          path: ${{ env.EPWSHIFTR_CHECK_CACHE }}
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('DESCRIPTION') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
          needs: coverage

      - name: Verify coverage adapter
        run: |
          Rscript --vanilla .github/check-coverage.R
          Rscript --vanilla .github/check-coverage-supervisor.R
        shell: bash

      - name: Test coverage
        id: coverage
        run: Rscript --vanilla .github/run-coverage.R
        shell: bash

      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-run/coverage-report/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: steps.coverage.outcome == 'success'
        id: codecov
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: ${{ runner.temp }}/coverage-run/coverage-report/coverage.xml
          disable_search: true
          # Expose the upload outcome so the next step can issue a warning.
          fail_ci_if_error: true
          use_oidc: true

      - name: Warn about Codecov upload failure
        if: steps.codecov.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Codecov upload failed. Coverage results remain available in the coverage-report artifact."
          echo "Codecov upload failed; download the coverage-report artifact for the computed results." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-diagnostics
          path: |
            ${{ runner.temp }}/coverage-run/diagnostics/
          retention-days: 7
