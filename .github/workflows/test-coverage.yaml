on:
  push:
    branches:
      - master
  pull_request:

name: test-coverage

jobs:
  test-coverage:
    runs-on: macOS-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install macOS system libraries
        shell: bash
        run: |
          brew install gettext
          echo "PKG_CPPFLAGS=-I$(brew --prefix gettext)/include" >> $GITHUB_ENV
          echo "PKG_LIBS=-L$(brew --prefix gettext)/lib -lintl" >> $GITHUB_ENV

      - name: Set EPWSHIFTR_CHECK_CACHE
        shell: bash
        run: |
          echo "EPWSHIFTR_CHECK_CACHE=${{ runner.temp }}/epwshiftr" >> $GITHUB_ENV
          if [ ! -d "${{ runner.temp }}/epwshiftr" ]; then mkdir -p "${{ runner.temp }}/epwshiftr"; fi

      - name: Cache NetCDF files
        uses: actions/cache@v4
        with:
          path: ${{ env.EPWSHIFTR_CHECK_CACHE }}
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('DESCRIPTION') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
          needs: coverage

      - name: Test coverage
        run: |
          install_path <- file.path(Sys.getenv("RUNNER_TEMP"), "covr-library")
          tryCatch(
            covr::codecov(
              quiet = FALSE,
              clean = FALSE,
              install_path = install_path,
              type = "none",
              # Worker termination may interrupt covr's exit-time writes.
              # Keep those traces for diagnosis, but measure coverage in the
              # main test process. All real-worker assertions still execute.
              code = r"(
                local({
                  traces <- file.path(
                    dirname(find.package("epwshiftr")), "worker-traces"
                  )
                  dir.create(traces, showWarnings = FALSE)
                  withr::with_envvar(c(COVERAGE_DIR = traces), {
                    testthat::test_dir(
                      system.file("tests/testthat", package = "epwshiftr"),
                      package = "epwshiftr",
                      load_package = "installed",
                      reporter = "check",
                      stop_on_failure = TRUE
                    )
                  })
                })
              )"
            ),
            error = function(error) {
              failures <- list.files(
                install_path,
                pattern = "\\.Rout\\.fail$",
                recursive = TRUE,
                full.names = TRUE
              )
              for (path in failures) {
                message("Test failure log: ", path)
                cat(readLines(path, warn = FALSE), sep = "\n")
              }
              stop(error)
            }
          )
        shell: Rscript {0}

      - name: Preserve coverage diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-diagnostics
          path: |
            ${{ runner.temp }}/covr-library/**/*.Rout*
            ${{ runner.temp }}/covr-library/worker-traces/
          retention-days: 7
