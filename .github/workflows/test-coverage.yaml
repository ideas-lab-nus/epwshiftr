on:
  push:
    branches:
      - master
  pull_request:

name: test-coverage

jobs:
  test-coverage:
    runs-on: macOS-latest

    permissions:
      contents: read
      id-token: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install macOS system libraries
        shell: bash
        run: |
          brew install gettext
          echo "PKG_CPPFLAGS=-I$(brew --prefix gettext)/include" >> $GITHUB_ENV
          echo "PKG_LIBS=-L$(brew --prefix gettext)/lib -lintl" >> $GITHUB_ENV

      - name: Set EPWSHIFTR_CHECK_CACHE
        shell: bash
        run: |
          echo "EPWSHIFTR_CHECK_CACHE=${{ runner.temp }}/epwshiftr" >> $GITHUB_ENV
          if [ ! -d "${{ runner.temp }}/epwshiftr" ]; then mkdir -p "${{ runner.temp }}/epwshiftr"; fi

      - name: Cache NetCDF files
        uses: actions/cache@v4
        with:
          path: ${{ env.EPWSHIFTR_CHECK_CACHE }}
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('DESCRIPTION') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
            any::processx
            any::ps
          needs: coverage

      - name: Check repository test tooling
        shell: Rscript {0}
        run: |
          scripts <- sort(list.files(".github/testing/tests", "[.]R$", full.names = TRUE))
          for (script in scripts) {
              processx::run(
                  file.path(R.home("bin"), "Rscript"),
                  c("--vanilla", script),
                  echo = TRUE, timeout = 180
              )
          }

      - name: Test coverage
        id: coverage
        run: |
          source(".github/coverage.R")
          prepared <- coverage__prepare(
            path = ".",
            directory = file.path(Sys.getenv("RUNNER_TEMP"), "covr-prepared"),
            quiet = FALSE
          )
          source(".github/testing/check-parallel.R")
          run_path <- file.path(Sys.getenv("RUNNER_TEMP"), "coverage-run")
          checks__run(
              library = readRDS(prepared)$library,
              output = run_path,
              shards = checks__default_shards(),
              durations = read.csv(".github/testing/coverage-durations.csv"),
              coverage = prepared,
              coverage_script = normalizePath(".github/coverage.R")
          )
          report_path <- file.path(Sys.getenv("RUNNER_TEMP"), "coverage-report")
          stopifnot(file.rename(file.path(run_path, "coverage-report"), report_path))
          cat(
            readLines(file.path(report_path, "summary.md")),
            sep = "\n", file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE
          )
        shell: Rscript {0}

      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report/
          retention-days: 14

      - name: Upload coverage to Codecov
        id: codecov
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: ${{ runner.temp }}/coverage-report/coverage.xml
          disable_search: true
          # Expose the upload outcome so the next step can issue a warning.
          fail_ci_if_error: true
          use_oidc: true

      - name: Warn about Codecov upload failure
        if: steps.codecov.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Codecov upload failed. Coverage results remain available in the coverage-report artifact."
          echo "Codecov upload failed; download the coverage-report artifact for the computed results." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve coverage diagnostics
        if: failure() && steps.coverage.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-diagnostics
          path: |
            ${{ runner.temp }}/covr-prepared/
            ${{ runner.temp }}/coverage-run/**/traces/
            ${{ runner.temp }}/coverage-run/**/stderr.log
            ${{ runner.temp }}/coverage-run/**/results.rds
          retention-days: 7
