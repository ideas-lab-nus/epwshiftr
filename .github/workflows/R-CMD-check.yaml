# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - main
      - master
  pull_request:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release', not_cran: false, full_tests: false}
          - {os: ubuntu-latest,  r: 'release', not_cran: true, full_tests: true}
          - {os: macos-latest,   r: 'release', not_cran: true, full_tests: false}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: ${{ matrix.config.not_cran }}
      EPWSHIFTR_REQUIRE_ALL_TESTS: ${{ matrix.config.full_tests }}
      EPWSHIFTR_RUN_LIVE_ESGF: ${{ matrix.config.full_tests }}
      EPWSHIFTR_RUN_LIVE_ERA5: ${{ matrix.config.full_tests }}
      ECMWF_DATASTORES_KEY: ${{ matrix.config.full_tests && secrets.ECMWF_DATASTORES_KEY || '' }}

    steps:
      - uses: actions/checkout@v4

      # The hosted Azure archive repeatedly stalled before setup-r could finish.
      # Change only that mirror host; retain Ubuntu pockets, signing and security.
      - name: Use the Ubuntu archive for Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          if [ ! -f "$ubuntu_sources" ]; then
            echo "::error::Expected Ubuntu deb822 sources at $ubuntu_sources."
            exit 1
          fi
          sudo perl -pi -e 's{://azure[.]archive[.]ubuntu[.]com/}{://archive.ubuntu.com/}g if /^URIs:/' "$ubuntu_sources"
          if ! grep -q '^URIs:.*://archive[.]ubuntu[.]com/' "$ubuntu_sources"; then
            echo "::error::Ubuntu archive mirror was not configured in $ubuntu_sources."
            exit 1
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Set EPWSHIFTR_CHECK_CACHE
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "EPWSHIFTR_CHECK_CACHE=${{ runner.temp }}/epwshiftr" >> $GITHUB_ENV
          if [ ! -d "${{ runner.temp }}/epwshiftr" ]; then mkdir -p "${{ runner.temp }}/epwshiftr"; fi

      - name: Cache NetCDF files
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.EPWSHIFTR_CHECK_CACHE }}
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('DESCRIPTION') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-

      - name: Install macOS system libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install gettext
          echo "PKG_CPPFLAGS=-I$(brew --prefix gettext)/include" >> $GITHUB_ENV
          echo "PKG_LIBS=-L$(brew --prefix gettext)/lib -lintl" >> $GITHUB_ENV

      - name: Prepare Linux full testing
        if: matrix.config.full_tests
        shell: bash
        run: |
          if [ -z "$ECMWF_DATASTORES_KEY" ]; then
            echo "::error::Repository secret ECMWF_DATASTORES_KEY is required for full testing."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y zip

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::webfakes
          needs: check

      - uses: r-lib/actions/check-r-package@v2
