on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

name: ERA5 live

permissions:
  contents: read

concurrency:
  group: era5-live
  cancel-in-progress: false

jobs:
  era5-live:
    runs-on: ubuntu-latest

    env:
      ECMWF_DATASTORES_KEY: ${{ secrets.ECMWF_DATASTORES_KEY }}
      EPWSHIFTR_RUN_LIVE_ERA5: "true"
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Require the CDS repository secret
        shell: bash
        run: |
          if [ -z "$ECMWF_DATASTORES_KEY" ]; then
            echo "::error::Repository secret ECMWF_DATASTORES_KEY is not configured."
            exit 1
          fi

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            url::https://cran.r-project.org/src/contrib/Archive/PCICt/PCICt_0.5-4.4.tar.gz
          needs: tests

      - name: Run the live ERA5 workflow
        shell: Rscript {0}
        run: |
          devtools::test(filter = "era5-live", stop_on_failure = TRUE)
